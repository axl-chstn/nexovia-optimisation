name: Vérifications
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Contrôle des archives et essais AG / PLS
        run: python code/verifier.py
      - name: Contrats de faisabilité et compléments
        run: python -m unittest discover -s tests -v
      - name: Notebook dans un noyau vierge
        run: python tools/verifier_notebook.py
